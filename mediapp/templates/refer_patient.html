{% extends "base.html" %}

{% block title %}Refer Patient{% endblock %}

{% block content %}
<div class="container d-flex justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="card shadow p-4" style="width: 50%; max-width: 600px;">
        <h2 class="text-center mb-4">Refer a Patient</h2>
        
        <form method="post">
            {% csrf_token %}

            <div class="mb-3">
                <label class="form-label">Patient Name</label>
                {{ form.patient_name }}
            </div>

            <div class="mb-3">
                <label class="form-label">Referring Doctor</label>
                {{ form.referring_doctor }}
            </div>

            <div class="mb-3">
                <label class="form-label">Referred Doctor</label>
                {{ form.referred_doctor }}
            </div>

            <div class="mb-3">
                <label class="form-label">Reason for Referral</label>
                {{ form.reason }}
            </div>

            <div class="d-flex justify-content-between">
                <a href="{% url 'doctor_dashboard' %}" class="btn btn-secondary">← Back to Medical Records</a>
                <button type="submit" class="btn btn-primary">Submit Referral</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
